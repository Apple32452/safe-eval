name: Exploratory exact-block audit

on:
  pull_request:
    paths:
      - 'experiments/exact_block_probe/**'
      - '.github/workflows/exact_block_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/exact_block_probe/requirements.txt
      - run: python -m unittest discover -s experiments/exact_block_probe -p 'test_*.py' -v
      - run: python experiments/exact_block_probe/exact_probe.py > /tmp/exact_block_replay.json
