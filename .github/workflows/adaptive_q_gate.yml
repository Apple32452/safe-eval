name: Exploratory adaptive-q audit

on:
  pull_request:
    paths:
      - 'experiments/adaptive_q_gate/**'
      - '.github/workflows/adaptive_q_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/adaptive_q_gate/requirements.txt
      - run: python -m unittest discover -s experiments/adaptive_q_gate -p 'test_*.py' -v
      - run: python experiments/adaptive_q_gate/audit.py --input experiments/adaptive_q_gate/results_reference.json
      - run: python experiments/adaptive_q_gate/adaptive_probe.py --repeats 1 --items 4 --output /tmp/adaptive_q_smoke.json
