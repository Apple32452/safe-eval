name: Exploratory exact-sequential audit

on:
  pull_request:
    paths:
      - 'experiments/exact_sequential_probe/**'
      - '.github/workflows/exact_sequential_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/exact_sequential_probe/requirements.txt
      - run: python -m unittest discover -s experiments/exact_sequential_probe -p 'test_*.py' -v
      - run: python experiments/exact_sequential_probe/audit.py --input experiments/exact_sequential_probe/results_reference.json
      - run: python experiments/exact_sequential_probe/sequential_probe.py --repeats 1 --items 4 --output /tmp/exact_sequential_smoke.json
