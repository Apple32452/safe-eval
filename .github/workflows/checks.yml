name: SAFE-EVAL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            experiments/stage7/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the released snapshot
        run: python scripts/check_release.py
      - name: Run invariant tests
        run: python -m unittest discover -s experiments/stage7 -p 'test_*.py' -v
      - name: Run one-repeat software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage7/run_stage7.py --repeats 1 --workers 2 --output results/stage7_smoke
      - name: Audit the software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage7/analyze_stage7.py --input results/stage7_smoke
