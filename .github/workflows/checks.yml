name: SAFE-EVAL checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            experiments/stage7/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the released snapshot
        run: python scripts/check_release.py
      - name: Run invariant tests
        run: |
          python -m unittest discover -s experiments/stage7 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage8 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage9 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage10 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage11 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage12 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage13 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage14 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage15 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage16 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage17 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage18 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage19 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage20 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage21 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage22 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage23 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage26 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage27 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage28 -p 'test_*.py' -v
          python -m unittest discover -s experiments/stage29 -p 'test_*.py' -v
      - name: Check the Stage 26 synthetic method gate
        run: python experiments/stage26/run_synthetic_gate.py --repeats 2 --output results/stage26_smoke
      - name: Audit the saved Stage 14 exploratory results
        run: |
          python experiments/stage14/summarize_pilot.py --input experiments/stage14/results_reference
          git diff --exit-code -- experiments/stage14/results_reference/SUMMARY.json
      - name: Run the Stage 14 shared-annotation software check
        run: |
          python experiments/stage14/shared_pilot.py --languages en-de --repeats 1 --output results/stage14_smoke
          python experiments/stage14/summarize_pilot.py --input results/stage14_smoke
      - name: Audit the saved Stage 15 development result
        run: |
          python experiments/stage15/audit_stage15.py --input experiments/stage15/results_reference
          git diff --exit-code -- experiments/stage15/results_reference/SUMMARY.json experiments/stage15/results_reference/VERIFICATION.json
      - name: Run the Stage 15 frontier software check
        run: |
          python experiments/stage15/frontier_experiment.py --languages en-de --repeats 1 --output results/stage15_smoke
          python experiments/stage15/summarize_stage15.py --input results/stage15_smoke
      - name: Audit the saved Stage 16 external result
        run: |
          python experiments/stage16/summarize_stage16.py --input experiments/stage16/results_reference
          git diff --exit-code -- experiments/stage16/results_reference/SUMMARY.json
      - name: Audit the saved Stage 17 continuous-score result
        run: |
          python experiments/stage17/summarize_stage17.py --input experiments/stage17/results_reference
          git diff --exit-code -- experiments/stage17/results_reference/SUMMARY.json
      - name: Audit the saved Stage 18 common-test-set comparison
        run: |
          python experiments/stage18/summarize_stage18.py --input experiments/stage18/results_reference
          git diff --exit-code -- experiments/stage18/results_reference/SUMMARY.json
      - name: Audit the saved Stage 19 common-core comparison
        run: |
          python experiments/stage19/summarize_stage19.py --input experiments/stage19/results_reference
          git diff --exit-code -- experiments/stage19/results_reference/SUMMARY.json
      - name: Audit the saved Stage 20 pruning comparison
        run: |
          python experiments/stage20/summarize_stage20.py --input experiments/stage20/results_reference
          git diff --exit-code -- experiments/stage20/results_reference/SUMMARY.json
      - name: Audit the saved Stage 21 chain comparison
        run: |
          python -m py_compile experiments/stage21/*.py
          python experiments/stage21/summarize_stage21.py --input experiments/stage21/results_reference
          git diff --exit-code -- experiments/stage21/results_reference/SUMMARY.json
      - name: Verify the Stage 22 graph-pruning release
        run: |
          python -m py_compile experiments/stage22/*.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('experiments/stage22/MANIFEST_SHA256.json').read_text())
          for path, expected in manifest.items():
              observed = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f'Stage 22 manifest mismatch: {path}')
          summary = json.loads(Path('experiments/stage22/results_reference/SUMMARY.json').read_text())
          verification = json.loads(Path('experiments/stage22/results_reference/VERIFICATION.json').read_text())
          assert summary['development_gate_passed'] is True
          assert verification['status'] == 'passed'
          assert verification['edge_dominance_violations'] == 0
          print(f"Verified {len(manifest)} Stage 22 files and the audited gate.")
          PY
      - name: Verify the Stage 23 synchronous-minimality audit
        run: |
          python -m py_compile experiments/stage23/*.py
          python experiments/stage23/audit_stage23.py
          python experiments/stage23/audit_async_prefix.py
      - name: Run the Stage 13 paired software check
        run: python experiments/stage13/run_stage13.py --repeats 2 --workers 1 --max-cases 3 --output results/stage13_smoke
      - name: Independently audit the Stage 13 paired software check
        run: python experiments/stage13/audit_stage13.py --input results/stage13_smoke
      - name: Check batched and serial Stage 13 audit agreement
        run: |
          cp results/stage13_smoke/decisions.npz results/stage13_smoke/serial_decisions.npz
          python experiments/stage13/audit_parallel_stage13.py --input results/stage13_smoke --workers 2
          python -c "from pathlib import Path; p=Path('results/stage13_smoke'); assert (p/'decisions.npz').read_bytes()==(p/'serial_decisions.npz').read_bytes()"
      - name: Summarize the Stage 13 paired software check
        run: python experiments/stage13/report_stage13.py --input results/stage13_smoke
      - name: Check Stage 13 exhaustive item-order randomization
        run: python experiments/stage13/audit_item_orders_stage13.py --output results/stage13_item_orders/VERIFICATION.json
      - name: Check the Stage 12 exact assignment audit
        run: python experiments/stage12/audit_stage12.py --output results/stage12_checks/VERIFICATION.json --check-reference experiments/stage12/results_reference/VERIFICATION.json
      - name: Verify the Stage 8 protocol
        run: python -c "import sys; sys.path.insert(0, 'experiments/stage8'); from stage8_common import verify_protocol; verify_protocol()"
      - name: Run one-repeat software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage7/run_stage7.py --repeats 1 --workers 2 --output results/stage7_smoke
      - name: Audit the software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage7/analyze_stage7.py --input results/stage7_smoke
      - name: Run the Stage 8 software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage8/run_stage8.py --repeats 1 --workers 2 --output results/stage8_smoke
      - name: Audit the Stage 8 software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage8/analyze_stage8.py --input results/stage8_smoke
      - name: Report Stage 8 path overheads
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage8/report_details.py --input results/stage8_smoke
      - name: Verify the Stage 9 protocol
        run: python -c "import sys; sys.path.insert(0, 'experiments/stage9'); from stage9_common import verify_protocol; verify_protocol()"
      - name: Verify the Stage 10 protocol
        run: python -c "import sys; sys.path.insert(0, 'experiments/stage10'); from stage10_common import verify_protocol; verify_protocol()"
      - name: Verify the Stage 11 protocol
        run: python -c "import sys; sys.path.insert(0, 'experiments/stage11'); from stage11_common import verify_protocol; verify_protocol()"
      - name: Certify the Stage 9 raw intervals
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage9/certify_stage9.py --output results/stage9_certificates
      - name: Run the Stage 9 software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage9/run_stage9.py --certificates results/stage9_certificates --repeats 1 --workers 2 --output results/stage9_smoke
      - name: Audit the Stage 9 software check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python experiments/stage9/analyze_stage9.py --certificates results/stage9_certificates --input results/stage9_smoke
